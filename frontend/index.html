<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AskMyNotes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Title -->
        <h1>AskMyNotes</h1>


        <!-- Upload PDF -->
        <div class="section">

            <label for="pdfFile" class="label">
                Upload your notes (PDF)
            </label>

            <input
                type="file"
                id="pdfFile"
                accept=".pdf,application/pdf"
            >

            <p id="fileName" class="file-name">
                Choose file
            </p>

        </div>


        <!-- Question -->
        <div class="section">

            <label for="questionInput" class="label">
                Your question
            </label>

            <textarea
                id="questionInput"
                placeholder="What is this?"
            ></textarea>

        </div>


        <!-- Ask Button -->
        <button id="askButton">
            Ask
        </button>


        <!-- Answer -->
        <div class="section answer-section">

            <div class="label">
                Answer
            </div>

            <div id="chatBox" class="chat-box">

                <div class="message bot">
                    <!-- Answer will appear here -->
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
