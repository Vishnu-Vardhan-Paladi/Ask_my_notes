services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: askmynotes-backend
    ports:
      - "7860:7860"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: askmynotes-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend